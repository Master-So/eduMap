version: '3.8'

services:
  # 1. The Database (MongoDB)
  database:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # 2. The Node.js Backend (Your teammate's code will go in a 'backend' folder)
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/heatmap_db
    depends_on:
      - database

  # 3. Your React Frontend
  frontend:
    build: ./student-app
    ports:
      - "8080:80"
    depends_on:
      - backend

# This keeps the database data from erasing when you turn off the containers
volumes:
  mongo-data: